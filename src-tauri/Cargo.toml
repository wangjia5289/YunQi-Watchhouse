[package]
name = "yunqi-watchhouse"
version = "0.1.0"
description = "A private, local-first computer activity timeline"
authors = ["YunQi-Watchhouse contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yunqi_watchhouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSWorkspace",
  "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSData",
  "NSDictionary",
  "NSString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "CGEventSource",
  "CGEventTypes",
] }
